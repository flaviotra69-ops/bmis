<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore BMI Scolastico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Calcolatore del BMI</h1>

    <div class="box">
        <form action="calcola.php" method="POST">
            <p>
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" required>
            </p>

            <p>
                <label for="weight">Peso (in kg):</label>
                <input type="number" id="weight" name="weight" required>
            </p>

            <p>
                <label for="height">Altezza (in cm):</label>
                <input type="number" id="height" name="height" required>
            </p>

            <p>
                <input type="submit" value="Calcola BMI">
            </p>
        </form>
    </div>

</body>
</html>
